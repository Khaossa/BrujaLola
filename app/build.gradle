plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.divinationapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.divinationapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Instructs Android Studio to fill the GEMINI_API_KEY in BuildConfig from local.properties
            buildConfigField("String", "GEMINI_API_KEY", "\"YOUR_API_KEY_HERE\"")
        }
        debug {
            // Also add for debug builds, useful for development
            buildConfigField("String", "GEMINI_API_KEY", "\"YOUR_API_KEY_HERE\"")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true // Ensure this is present
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Gemini API Client SDK
    implementation("com.google.ai.client.generativeai:generativeai:0.2.0") // Or latest available

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
